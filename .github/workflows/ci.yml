name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  docker:
    name: Docker images build + in-container tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose interpolates ${VARS} with no fallbacks — .env.example has them all
      - run: cp .env.example .env
      - name: Build images
        run: docker compose build
      - name: Run test suite inside the built image
        run: docker compose run --rm --no-deps -T neighbourhood-similarity python -m pytest tests -q
